<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test App</title>
<style>
  :root { --bg:#0b1020; --card:rgba(255,255,255,.06); --text:#e6ebff; --muted:#9aa6d1; --a:#4f8cff; --b:#9b5cff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(circle at 20% 20%, #1b2550, transparent 50%),
                radial-gradient(circle at 80% 80%, #2a1b50, transparent 50%), var(--bg);
    color: var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap { max-width:900px; width:100%; text-align:center; }
  h1 {
    font-size:clamp(2rem,6vw,3.5rem);
    background:linear-gradient(90deg,var(--a),var(--b));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub { color:var(--muted); margin:12px 0 40px; font-size:1.1rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; }
  .card {
    background:var(--card); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px); border-radius:16px; padding:24px 16px;
    transition:transform .25s, border-color .25s, box-shadow .25s;
  }
  .card:hover { transform:translateY(-6px); border-color:var(--a); box-shadow:0 10px 30px rgba(79,140,255,.25); }
  .card h3 { margin-bottom:6px; }
  .card p { color:var(--muted); font-size:.9rem; }
  .status { margin-top:40px; display:inline-flex; align-items:center; gap:10px;
    padding:10px 20px; border-radius:999px; background:var(--card); border:1px solid rgba(255,255,255,.12); }
  .dot { width:10px; height:10px; border-radius:50%; background:#2ee59d; animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(46,229,157,.6)} 100%{box-shadow:0 0 0 12px rgba(46,229,157,0)} }
  footer { margin-top:30px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Test Application</h1>
    <p class="sub">Docker + nginx + CI/CD pipeline check</p>

    <div class="grid">
      <div class="card"><h3>🐳 Docker</h3><p>Image built successfully</p></div>
      <div class="card"><h3>🔍 Scan</h3><p>Trivy security scan</p></div>
      <div class="card"><h3>📦 Registry</h3><p>Image pushed</p></div>
      <div class="card"><h3>🚀 Deploy</h3><p>Container running</p></div>
    </div>

    <div class="status"><span class="dot"></span> App is running</div>

    <footer>Version 1.0 · Served by nginx</footer>
  </div>
</body>
</html>
